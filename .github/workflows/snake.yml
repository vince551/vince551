name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: vince551
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=00ff88&color_dots=#161b22,#0b3d2e,#0f6b4a,#00ff88
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=00ff88&color_dots=#161b22,#0b3d2e,#0f6b4a,#00ff88

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DIR: dist
