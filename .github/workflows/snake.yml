name: Generate contribution dragon

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution animation
        uses: Platane/snk@v3
        with:
          github_user_name: vince551
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=00ff88&color_dots=#050505,#0b1f16,#0f6b4a,#00ff88
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=00ff88&color_dots=#050505,#0b1f16,#0f6b4a,#00ff88

      - name: Publish generated files to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
