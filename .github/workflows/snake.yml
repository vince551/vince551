name: Generate contribution dragon

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution animation
        uses: Platane/snk@v3
        with:
          github_user_name: vince551
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=00C2A8&color_dots=#0B1B2B,#164E63,#0E7490,#22D3EE,#F5B942
            dist/github-contribution-grid-snake-dark.svg?color_snake=00C2A8&color_dots=#0B1B2B,#164E63,#0E7490,#22D3EE,#F5B942

      - name: Publish generated files to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
